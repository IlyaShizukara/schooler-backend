<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="background:#0A0A12;color:#F5F5F7;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;">
  <p id="status">Входим...</p>
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    fetch("/api/auth/webapp", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ init_data: tg.initData }),
    })
      .then(r => r.json())
      .then(data => {
        if (data.session_token) {
          window.location.href = "https://myschooler.ru/?wa_token=" + encodeURIComponent(data.session_token);
        } else {
          document.getElementById("status").textContent = "Не удалось войти. Откройте приложение обычным способом.";
        }
      })
      .catch(() => {
        document.getElementById("status").textContent = "Ошибка соединения.";
      });
  </script>
</body>
</html>
